<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" preserveAspectRatio="xMaxYMax slice">
  <defs>
    <linearGradient id="torre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="desvanece" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="900" height="400" fill="url(#desvanece)"/></mask>
    <pattern id="ventanas" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="6" height="9" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <g mask="url(#m)">
    <!-- torres -->
    <g fill="url(#torre)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1">
      <rect x="330" y="210" width="70" height="190"/>
      <rect x="415" y="140" width="90" height="260"/>
      <path d="M520 400V90l60-30 60 30v310z"/>
      <rect x="655" y="170" width="80" height="230"/>
      <rect x="750" y="110" width="70" height="290"/>
      <rect x="830" y="230" width="70" height="170"/>
    </g>
    <g fill="url(#ventanas)">
      <rect x="415" y="150" width="90" height="250"/>
      <rect x="530" y="100" width="100" height="300"/>
      <rect x="750" y="120" width="70" height="280"/>
    </g>
    <!-- línea de crecimiento -->
    <polyline points="260,330 360,300 440,312 530,240 620,252 720,170 820,120 900,80"
      fill="none" stroke="#c9a240" stroke-width="2.5" stroke-linejoin="round" stroke-opacity="0.85"/>
    <g fill="#c9a240">
      <circle cx="530" cy="240" r="4"/>
      <circle cx="720" cy="170" r="4"/>
      <circle cx="820" cy="120" r="4"/>
    </g>
  </g>
</svg>
